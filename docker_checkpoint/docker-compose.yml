services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-python-app:v1
    expose:
      - "5000"
    networks:
      - app-net

  nginx:
    image: nginx:latest
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net

networks:
  app-net:
    driver: bridge